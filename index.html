<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Save Orange County</title>
<meta name="robots" content="noindex" />
<meta property="og:title" content="Save Orange County" />
<meta property="og:image" content="https://saveorangecountyva.com/hero-virginia.jpg" />
<meta property="og:video" content="https://saveorangecountyva.com/hero-virginia.mp4" />
<meta property="og:url" content="https://saveorangecountyva.com/" />
<style>
  html,body{height:100%}
  body{
    margin:0;background:#11150f;
    display:flex;align-items:center;justify-content:center;
    min-height:100svh;padding:24px;box-sizing:border-box;
    font-family:system-ui,-apple-system,sans-serif;
  }
  .stage{position:relative;width:50%;max-width:50%}
  video{width:100%;height:auto;max-height:calc(100svh - 48px);display:block;object-fit:contain}
  #sound{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;
    background:rgba(0,0,0,.62);color:#fff;border:1px solid rgba(255,255,255,.34);
    border-radius:999px;padding:10px 18px;font-size:.85rem;font-weight:500;
    cursor:pointer;backdrop-filter:blur(6px);white-space:nowrap;
    transition:opacity .25s ease;
  }
  #sound:hover{background:rgba(0,0,0,.8)}
  #sound.gone{opacity:0;pointer-events:none}
  @media(max-width:700px){
    .stage{width:85%;max-width:85%}
    #sound{font-size:.8rem;padding:9px 15px;bottom:12px}
  }
</style>
</head>
<body>
  <div class="stage">
    <video id="v" src="hero-virginia.mp4" poster="hero-virginia.jpg"
           autoplay muted loop playsinline preload="auto">
      <img src="hero-virginia.jpg" alt="Orange County, Virginia" />
    </video>
    <button id="sound" type="button" aria-label="Turn sound on">
      <span aria-hidden="true">&#9834;</span> Tap for sound
    </button>
  </div>

<script>
(function(){
  var v=document.getElementById('v'), b=document.getElementById('sound');
  b.addEventListener('click',function(){
    v.muted=false;
    v.volume=1;
    var p=v.play();
    if(p&&p.catch)p.catch(function(){});
    b.classList.add('gone');
  });
  // if the browser ever allows unmuted playback on its own, drop the button
  v.addEventListener('volumechange',function(){ if(!v.muted) b.classList.add('gone'); });
})();
</script>
</body>
</html>
