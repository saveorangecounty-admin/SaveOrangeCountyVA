<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Save Orange County</title>
<meta name="robots" content="noindex" />
<meta property="og:title" content="Save Orange County" />
<meta property="og:image" content="https://saveorangecountyva.com/hero-virginia.jpg" />
<meta property="og:video" content="https://saveorangecountyva.com/hero-virginia.mp4" />
<meta property="og:url" content="https://saveorangecountyva.com/" />
<style>
  html,body{height:100%}
  body{
    margin:0;
    background:#11150f;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    padding:24px;
    box-sizing:border-box;
  }
  video,img{
    width:50%;
    max-width:50%;
    max-height:calc(100svh - 48px);
    height:auto;
    display:block;
    object-fit:contain;
  }
  @media(max-width:700px){
    video,img{width:85%;max-width:85%}
  }
</style>
</head>
<body>
  <video
    src="hero-virginia.mp4"
    poster="hero-virginia.jpg"
    autoplay
    muted
    loop
    playsinline
    preload="auto">
    <img src="hero-virginia.jpg" alt="Orange County, Virginia" />
  </video>
</body>
</html>
