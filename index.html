<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveOrangeCountyVA.com — Domain Available</title>
  <meta name="description" content="The SaveOrangeCountyVA.com domain is available for acquisition. Contact the webmaster for inquiries.">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="SaveOrangeCountyVA.com — Domain Available">
  <meta property="og:description" content="This domain is available for acquisition. Contact the webmaster for inquiries.">
  <meta property="og:image" content="https://saveorangecountyva.com/hero-virginia.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://saveorangecountyva.com/">

  <link rel="preload" href="hero-virginia.jpg" as="image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #f4ecd6;
      background: #0a0e08;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      background-image: url('hero-virginia.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(10,14,8,0.55) 0%, rgba(10,14,8,0.45) 50%, rgba(10,14,8,0.78) 100%);
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 3rem 1.5rem;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    .label {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #d4a840;
      margin-bottom: 1.75rem;
      opacity: 0.95;
    }

    h1 {
      font-size: clamp(2.5rem, 6.5vw, 4rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 1.5rem;
      color: #f4ecd6;
    }

    h1 .accent {
      font-style: italic;
      color: #d4a840;
      display: block;
      margin-top: 0.25rem;
    }

    .lede {
      font-size: clamp(1.05rem, 2vw, 1.2rem);
      line-height: 1.65;
      color: rgba(244, 236, 214, 0.88);
      max-width: 540px;
      margin: 0 auto;
    }

    .footer {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      padding: 1.75rem 1.5rem;
      flex-wrap: wrap;
    }

    .footer-contact-btn {
      background: transparent;
      border: none;
      color: #f4ecd6;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem;
      font-style: italic;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: rgba(212, 168, 64, 0.6);
      text-underline-offset: 4px;
      transition: color 0.2s ease;
      padding: 0.25rem 0.5rem;
    }

    .footer-contact-btn:hover, .footer-contact-btn:focus {
      color: #d4a840;
      outline: none;
    }

    .footer-copy {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: rgba(244, 236, 214, 0.55);
    }

    /* ----- Webmaster contact modal (preserved) ----- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 6, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      position: relative;
      background: rgba(18, 22, 14, 0.96);
      border: 1px solid rgba(212, 168, 64, 0.35);
      border-radius: 4px;
      padding: 2.5rem 2rem 2rem;
      max-width: 460px;
      width: 100%;
      color: #f4ecd6;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }

    .modal-close-x {
      position: absolute;
      top: 0.5rem;
      right: 0.85rem;
      background: transparent;
      border: none;
      color: rgba(244, 236, 214, 0.6);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      transition: color 0.2s ease;
    }

    .modal-close-x:hover { color: #d4a840; }

    .modal-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.65rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    .modal-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: rgba(244, 236, 214, 0.65);
      margin-bottom: 1.4rem;
    }

    .modal-form input,
    .modal-form textarea {
      width: 100%;
      background: rgba(10, 14, 8, 0.6);
      border: 1px solid rgba(212, 168, 64, 0.3);
      color: #f4ecd6;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.9rem;
      border-radius: 3px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .modal-form input:focus,
    .modal-form textarea:focus {
      border-color: rgba(212, 168, 64, 0.8);
    }

    .modal-form textarea {
      min-height: 130px;
      resize: vertical;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1rem;
    }

    .modal-form-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .modal-btn-submit,
    .modal-btn-cancel {
      flex: 1;
      padding: 0.85rem 1rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s ease;
    }

    .modal-btn-submit {
      background: rgba(212, 168, 64, 0.85);
      color: #1a1e14;
      border: 1px solid rgba(212, 168, 64, 0.85);
    }

    .modal-btn-submit:hover { background: #d4a840; }
    .modal-btn-submit:disabled { opacity: 0.6; cursor: wait; }

    .modal-btn-cancel {
      background: transparent;
      color: rgba(244, 236, 214, 0.7);
      border: 1px solid rgba(244, 236, 214, 0.25);
    }

    .modal-btn-cancel:hover {
      color: #f4ecd6;
      border-color: rgba(244, 236, 214, 0.55);
    }

    .modal-success {
      display: none;
      text-align: center;
      padding: 2rem 0 1rem;
    }

    .modal-success p {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.3rem;
      line-height: 1.5;
      color: #f4ecd6;
    }

    @media (max-width: 480px) {
      .footer { flex-direction: column; gap: 0.75rem; padding: 1.25rem 1rem; }
      main { padding: 2rem 1.25rem; }
      h1 { font-size: 2.25rem; }
    }
  </style>
</head>
<body>

<!-- Hidden Netlify form detection -->
<form name="webmaster-contact" netlify netlify-honeypot="bot-field" hidden>
  <input name="email" type="email"><textarea name="message"></textarea>
</form>

<main>
  <div class="label">SaveOrangeCountyVA.com</div>
  <h1>Domain<span class="accent">Available.</span></h1>
  <p class="lede">For acquisition inquiries, please reach out using the <em>Contact Webmaster</em> link below.</p>
</main>

<footer class="footer">
  <button class="footer-contact-btn" onclick="document.getElementById('webmaster-overlay').classList.add('open')">Contact Webmaster</button>
  <span class="footer-copy">&copy; 2026 SaveOrangeCountyVA.com</span>
</footer>

<!-- Webmaster contact modal -->
<div id="webmaster-overlay" class="modal-overlay" onclick="if(event.target===this)closeWebmaster()">
  <div class="modal-box">
    <button class="modal-close-x" onclick="closeWebmaster()" aria-label="Close">&times;</button>
    <div id="webmaster-form-wrap">
      <p class="modal-title">Contact Webmaster</p>
      <p class="modal-sub">Domain inquiries and other questions welcome.</p>
      <form class="modal-form" name="webmaster-contact" method="POST" data-netlify="true" onsubmit="handleWebmasterSubmit(event)">
        <input type="hidden" name="form-name" value="webmaster-contact">
        <input type="hidden" name="bot-field">
        <input type="email" name="email" placeholder="Your email address" required>
        <textarea name="message" placeholder="Your message..." required></textarea>
        <div class="modal-form-row">
          <button type="submit" class="modal-btn-submit">Send Message</button>
          <button type="button" class="modal-btn-cancel" onclick="closeWebmaster()">Cancel</button>
        </div>
      </form>
    </div>
    <div id="webmaster-success" class="modal-success">
      <p>Thank you.<br>Your message has been received.</p>
    </div>
  </div>
</div>

<script>
  function closeWebmaster() {
    document.getElementById('webmaster-overlay').classList.remove('open');
    setTimeout(()=>{
      document.getElementById('webmaster-form-wrap').style.display='block';
      document.getElementById('webmaster-success').style.display='none';
    },400);
  }
  async function handleWebmasterSubmit(e) {
    e.preventDefault();
    const form=e.target, btn=form.querySelector('button[type="submit"]');
    btn.textContent='Sending...'; btn.disabled=true;
    try {
      await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(form)).toString()});
      document.getElementById('webmaster-form-wrap').style.display='none';
      document.getElementById('webmaster-success').style.display='block';
    } catch(err){ btn.textContent='Error — try again'; btn.disabled=false; }
  }
</script>

</body>
</html>
